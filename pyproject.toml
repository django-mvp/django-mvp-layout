[project]
name = "django-mvp-layout"
description = "Page layouts arranged by a nine-letter layout code, with sidebars that open, close, collapse and nest"
# Pre-viable. The first published release is 0.1.0, cut once the Essential
# goals in GOALS.md are delivered; until then the version stays in 0.0.x and
# nothing is uploaded to the package index.
version = "0.2.0"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# Layout components for any Django project, so django-mvp is deliberately not a
# dependency: django-mvp is one of the projects meant to use this. daisyUI is
# the host's, not a dependency: the stylesheet reads its theme colours and falls
# back to the system's.
dependencies = ["django>=5.2", "django-cotton>=2.9"]
keywords = ["django", "django-mvp", "django-cotton", "daisyui", "layout", "sidebar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-mvp-layout"
Repository = "https://github.com/django-mvp/django-mvp-layout"
Issues = "https://github.com/django-mvp/django-mvp-layout/issues"

[tool.hatch.build.targets.wheel]
# The demo project is deliberately absent: it is a place to look at this
# package while it is being written, not something a consuming project should
# receive.
packages = ["mvp_layout"]

# Hatchling's default source distribution is the whole working tree: tests, the
# demonstration project, documentation and CI configuration. Listing what ships
# keeps it to the package, the readme and the licence. Hatchling adds
# .gitignore itself, so that a build from the source distribution leaves out
# what the repository does. The leading slashes anchor each entry to the
# repository root, so `/README.md` does not also match `tests/README.md`.
[tool.hatch.build.targets.sdist]
include = ["/mvp_layout", "/README.md", "/LICENSE"]

[dependency-groups]
# Shared toolchain bundle, pinned to a release tag so every package built this
# way runs one version of each tool. Ships ruff, mypy, deptry, pre-commit,
# pytest, pytest-django, pytest-xdist, factory-boy, coverage and django-stubs.
dev = [
    "mvp-shared[dev,test]",
    # Some guarantees can only be measured in a real browser: a resolved height,
    # a computed colour, an element that moves when the window does. Rendered
    # markup cannot answer any of them.
    "pytest-playwright>=0.5",
]
# Installed only where the documentation is built: `uv sync --group docs`.
docs = ["fairdm-docs"]

[tool.uv.sources]
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs" }
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
# A browser test runs inside a greenlet with an event loop under it, and Django
# refuses synchronous database work from an async context — so building the
# test database for `live_server` raises before any page loads. The check
# exists to stop application code calling the ORM from an async view, which is
# not what is happening here: the only database work in this suite is the
# harness building and tearing down its own test database.
#
# Scoping this to the browser tests was tried and does not work. pytest-django
# sets the database up from an autouse fixture, which runs before any fixture a
# test can ask for.
env = ["DJANGO_ALLOW_ASYNC_UNSAFE=1"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["mvp_layout"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three do not appear here. The
# shared rule set lives in ruff-base.toml, copied in rather than referenced
# remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The demo project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"demo/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["mvp_layout"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "mvp_layout/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tests/", "demo/", "docs/"]

[tool.deptry.per_rule_ignores]
# django-cotton is a runtime dependency that no Python module here imports:
# the <c-layout> components are Cotton templates.
DEP002 = ["django-cotton"]

[tool.forge.conformance]
# None of these has a Python module under mvp_layout/ to mirror: the undistributed
# demo and the installed layout. The last two test the committed static assets
# (the script and the stylesheet), not a Python module.
non-mirror-paths = [
  "tests/test_demo.py",
  "tests/test_smoke.py",
  "tests/test_layout_js.py",
  "tests/test_build_css.py",
  # The component tests render Cotton templates, not a Python module.
  "tests/test_components/",
]
